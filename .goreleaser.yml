# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test -count=1 ./...

builds:
  - id: ainovel-cli
    main: ./cmd/ainovel-cli
    binary: ainovel-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: ainovel-server
    main: ./cmd/ainovel-server
    binary: ainovel-server
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ainovel-cli-archive
    ids:
      - ainovel-cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

  - id: ainovel-server-archive
    ids:
      - ainovel-server
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      # 服务端的配置/挂载/排错说明随包发布。
      - cmd/ainovel-server/README.md
    name_template: >-
      {{ .ProjectName }}_server_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^feat'
    - title: "Bug Fixes"
      regexp: '^fix'
    - title: "Performance"
      regexp: '^perf'
    - title: "Refactor"
      regexp: '^refactor'
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"

release:
  github:
    # 由 workflow 注入 github.repository_owner：上游发布到 voocel，fork 发布到
    # 自己的账号。写死 voocel 会让 fork 的 tag 发布因无权限而失败。
    owner: "{{ .Env.RELEASE_OWNER }}"
    name: ainovel-cli
