<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ainovel 控制台</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212a; --line: #272c37;
    --fg: #e6e8ee; --dim: #8b93a7; --accent: #6ea8fe; --ok: #4ade80;
    --warn: #fbbf24; --err: #f87171; --run: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); height: 100vh; overflow: hidden;
    font: 13px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  #app { display: grid; grid-template-columns: 290px 1fr 1fr; height: 100vh; }
  .col { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  .col:last-child { border-right: none; }
  header {
    padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
  }
  h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .grow { flex: 1; }
  .body { flex: 1; overflow: auto; padding: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; margin-bottom: 8px; cursor: pointer;
  }
  .card:hover { border-color: #3a4252; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .row { display: flex; align-items: center; gap: 6px; }
  .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .tag {
    font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel2);
    color: var(--dim); border: 1px solid var(--line);
  }
  .tag.running { color: #0f1115; background: var(--run); border-color: var(--run); }
  .tag.done, .tag.completed { color: #0f1115; background: var(--ok); border-color: var(--ok); }
  .tag.paused, .tag.idle { color: #0f1115; background: var(--warn); border-color: var(--warn); }
  .tag.err { color: #fff; background: var(--err); border-color: var(--err); }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.pri { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, textarea {
    width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font: inherit; resize: none;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .bar { height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .kv b { color: var(--dim); font-weight: 500; }
  .kv span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ev { padding: 3px 6px; border-left: 2px solid var(--line); margin-bottom: 2px; }
  .ev.MODEL { border-color: var(--accent); }
  .ev.TOOL { border-color: #6ee7b7; }
  .ev.ERROR { border-color: var(--err); }
  .ev.SYSTEM, .ev.USER { border-color: var(--warn); }
  .ev .c { color: var(--dim); margin-right: 6px; }
  .ev.running { opacity: .7; font-style: italic; }
  .ev .ms { float: right; color: var(--dim); }
  .agent { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px; margin-bottom: 6px; }
  .agent .st { font-size: 11px; color: var(--dim); }
  .foot { border-top: 1px solid var(--line); padding: 8px; display: flex; gap: 6px; align-items: flex-end; background: var(--panel); }
  pre.ch {
    white-space: pre-wrap; word-break: break-word; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px;
    font: 14px/1.9 "Songti SC", Georgia, serif;
  }
  #stream {
    white-space: pre-wrap; word-break: break-word; font: 13px/1.7 ui-monospace, Menlo, monospace;
    color: #cfd6e4;
  }
  .hint { color: var(--dim); font-size: 12px; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--err); color: #fff; padding: 8px 14px; border-radius: 6px; display: none; z-index: 9;
  }
</style>
</head>
<body>
<div id="app">
  <!-- 左：项目列表 -->
  <div class="col">
    <header>
      <h1>ainovel</h1><span class="grow"></span>
      <span class="tag" id="conn">连接中</span>
    </header>
    <div class="body" id="list"></div>
    <div class="foot" style="flex-direction:column;align-items:stretch;gap:6px">
      <input id="np-id" placeholder="项目 id（留空自动生成）">
      <textarea id="np-prompt" rows="3" placeholder="一句话需求，例如：写一本东方玄幻长篇，主角从边陲小城起步"></textarea>
      <div class="row">
        <button class="pri" id="np-go">新建并开写</button>
        <button id="np-scan">刷新</button>
      </div>
      <div class="row">
        <input id="mt-dir" placeholder="挂载已有书：填书目录绝对路径">
        <button id="mt-go" style="flex:0 0 auto">挂载</button>
      </div>
    </div>
  </div>

  <!-- 中：当前书状态 + 事件流 -->
  <div class="col">
    <header>
      <h1 id="cur-title">未选择项目</h1><span class="grow"></span>
      <span class="tag" id="cur-state">-</span>
    </header>
    <div class="body">
      <div class="card" style="cursor:default" id="stat"></div>
      <div class="row" style="flex-wrap:wrap;margin-bottom:8px">
        <button id="b-resume">恢复</button>
        <button id="b-abort">暂停</button>
        <button id="b-review">逐章验收</button>
        <button id="b-auto">自动推进</button>
        <button id="b-next">放行下一章</button>
        <button id="b-chapter">读最新章</button>
      </div>
      <div class="sub" style="margin-bottom:6px">实时事件（SSE）</div>
      <div id="log" style="max-height:46vh;overflow:auto"></div>
    </div>
    <div class="foot">
      <textarea id="steer" rows="2" placeholder="实时干预：把感情线提前到第4章，增加男女主的对手戏"></textarea>
      <div class="row" style="flex:0 0 auto">
        <button class="pri" id="b-steer">干预</button>
        <button id="b-continue">继续</button>
      </div>
    </div>
  </div>

  <!-- 右：模型流式输出 / 章节正文 -->
  <div class="col">
    <header>
      <h1>输出</h1><span class="grow"></span>
      <span class="hint" id="ctx"></span>
    </header>
    <div class="body" id="out"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
