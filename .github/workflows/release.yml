name: Release

on:
  push:
    tags:
      - "v*"
  # 手动补发：这个 fork 上 push 触发没有排队（tag 已推上去但 workflow 没跑），
  # 用 `gh workflow run release.yml --ref <tag>` 补。GoReleaser 要求检出点在 tag 上，
  # 所以 dispatch 时务必带上对应 tag 作为 ref。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate release notes
        run: .github/scripts/gen-changelog.sh > release-notes.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # fork 里 tag 发布必须指向 fork 自己的账号，不能沿用写死的上游 owner。
          RELEASE_OWNER: ${{ github.repository_owner }}
